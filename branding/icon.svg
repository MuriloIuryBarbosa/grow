<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#2E7D32"/>
  
  <!-- Gradient for depth -->
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5D4037"/>
      <stop offset="100%" style="stop-color:#795548"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Plant pot -->
  <path d="M362 700 L662 700 L622 850 L402 850 Z" fill="#8D6E63" filter="url(#shadow)"/>
  <ellipse cx="512" cy="700" rx="150" ry="25" fill="#A1887F"/>
  
  <!-- Soil -->
  <ellipse cx="512" cy="700" rx="130" ry="18" fill="#5D4037"/>
  
  <!-- Main stem -->
  <path d="M512 700 Q512 550 512 400" stroke="url(#stemGradient)" stroke-width="20" fill="none" stroke-linecap="round"/>
  
  <!-- Left branch -->
  <path d="M512 500 Q450 480 400 420" stroke="url(#stemGradient)" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Right branch -->
  <path d="M512 450 Q574 430 624 370" stroke="url(#stemGradient)" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Main top leaf -->
  <ellipse cx="512" cy="320" rx="80" ry="120" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-10 512 320)"/>
  <path d="M512 400 Q512 320 512 200" stroke="#388E3C" stroke-width="4" fill="none"/>
  
  <!-- Left leaf -->
  <ellipse cx="370" cy="380" rx="60" ry="90" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-35 370 380)"/>
  <path d="M400 420 Q370 380 350 300" stroke="#388E3C" stroke-width="3" fill="none"/>
  
  <!-- Right leaf -->
  <ellipse cx="654" cy="330" rx="55" ry="85" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(25 654 330)"/>
  <path d="M624 370 Q654 330 670 260" stroke="#388E3C" stroke-width="3" fill="none"/>
  
  <!-- Small accent leaves -->
  <ellipse cx="460" cy="420" rx="30" ry="50" fill="#81C784" transform="rotate(-20 460 420)"/>
  <ellipse cx="564" cy="400" rx="28" ry="45" fill="#81C784" transform="rotate(15 564 400)"/>
  
  <!-- Growth indicator (upward arrow integrated) -->
  <path d="M800 250 L850 180 L900 250 M850 180 L850 350" stroke="#C8E6C9" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Sparkle/growth dots -->
  <circle cx="300" cy="280" r="12" fill="#E8F5E9" opacity="0.8"/>
  <circle cx="750" cy="450" r="10" fill="#E8F5E9" opacity="0.7"/>
  <circle cx="270" cy="450" r="8" fill="#E8F5E9" opacity="0.6"/>
</svg>
