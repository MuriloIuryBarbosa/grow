<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#2E7D32"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A5D6A7"/>
      <stop offset="100%" style="stop-color:#66BB6A"/>
    </linearGradient>
    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D4C41"/>
      <stop offset="100%" style="stop-color:#8D6E63"/>
    </linearGradient>
    <linearGradient id="potGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A1887F"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Plant pot - positioned lower -->
  <path d="M320 680 L704 680 L650 880 L374 880 Z" fill="url(#potGradient)" filter="url(#shadow)"/>
  <ellipse cx="512" cy="680" rx="192" ry="32" fill="#8D6E63"/>
  
  <!-- Soil in pot -->
  <ellipse cx="512" cy="680" rx="170" ry="24" fill="#5D4037"/>
  
  <!-- Main stem - growing from soil -->
  <path d="M512 680 C512 600 512 500 512 350" stroke="url(#stemGradient)" stroke-width="24" fill="none" stroke-linecap="round"/>
  
  <!-- Left branch -->
  <path d="M512 520 Q440 490 380 420" stroke="url(#stemGradient)" stroke-width="14" fill="none" stroke-linecap="round"/>
  
  <!-- Right branch -->
  <path d="M512 450 Q584 420 640 350" stroke="url(#stemGradient)" stroke-width="14" fill="none" stroke-linecap="round"/>
  
  <!-- Center small branch -->
  <path d="M512 580 Q480 550 450 520" stroke="url(#stemGradient)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M512 560 Q544 530 574 500" stroke="url(#stemGradient)" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Main top leaf -->
  <ellipse cx="512" cy="280" rx="70" ry="110" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-5 512 280)"/>
  <path d="M512 350 Q512 280 512 180" stroke="#43A047" stroke-width="4" fill="none"/>
  
  <!-- Left large leaf -->
  <ellipse cx="350" cy="380" rx="55" ry="90" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-40 350 380)"/>
  <path d="M380 420 Q350 380 320 300" stroke="#43A047" stroke-width="3" fill="none"/>
  
  <!-- Right large leaf -->
  <ellipse cx="670" cy="320" rx="50" ry="85" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(35 670 320)"/>
  <path d="M640 350 Q670 320 690 250" stroke="#43A047" stroke-width="3" fill="none"/>
  
  <!-- Small accent leaves near stem -->
  <ellipse cx="440" cy="480" rx="28" ry="48" fill="#81C784" transform="rotate(-25 440 480)"/>
  <ellipse cx="584" cy="460" rx="26" ry="44" fill="#81C784" transform="rotate(20 584 460)"/>
  
  <!-- Growth arrow - top right corner -->
  <g transform="translate(760, 120)">
    <path d="M0 100 L40 40 L80 100" stroke="#C8E6C9" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 40 L40 180" stroke="#C8E6C9" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative sparkles -->
  <circle cx="180" cy="200" r="10" fill="#E8F5E9" opacity="0.7"/>
  <circle cx="250" cy="320" r="7" fill="#E8F5E9" opacity="0.5"/>
  <circle cx="150" cy="450" r="8" fill="#E8F5E9" opacity="0.6"/>
</svg>
