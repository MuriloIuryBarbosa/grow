<svg width="1284" height="2778" viewBox="0 0 1284 2778" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1284" height="2778" fill="#2E7D32"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#388E3C"/>
      <stop offset="50%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>
    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5D4037"/>
      <stop offset="100%" style="stop-color:#795548"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="1284" height="2778" fill="url(#bgGradient)"/>
  
  <!-- Centered icon (scaled and positioned) -->
  <g transform="translate(392, 1089)">
    <!-- Plant pot -->
    <path d="M150 400 L350 400 L320 500 L180 500 Z" fill="#8D6E63" filter="url(#shadow)"/>
    <ellipse cx="250" cy="400" rx="100" ry="18" fill="#A1887F"/>
    <ellipse cx="250" cy="400" rx="85" ry="12" fill="#5D4037"/>
    
    <!-- Main stem -->
    <path d="M250 400 Q250 300 250 180" stroke="url(#stemGradient)" stroke-width="14" fill="none" stroke-linecap="round"/>
    
    <!-- Left branch -->
    <path d="M250 280 Q200 265 165 220" stroke="url(#stemGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Right branch -->
    <path d="M250 240 Q300 225 335 185" stroke="url(#stemGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Main top leaf -->
    <ellipse cx="250" cy="130" rx="55" ry="85" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-10 250 130)"/>
    <path d="M250 180 Q250 130 250 50" stroke="#388E3C" stroke-width="3" fill="none"/>
    
    <!-- Left leaf -->
    <ellipse cx="145" cy="190" rx="42" ry="65" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-35 145 190)"/>
    <path d="M165 220 Q145 190 130 130" stroke="#388E3C" stroke-width="2" fill="none"/>
    
    <!-- Right leaf -->
    <ellipse cx="355" cy="155" rx="40" ry="60" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(25 355 155)"/>
    <path d="M335 185 Q355 155 365 105" stroke="#388E3C" stroke-width="2" fill="none"/>
    
    <!-- Small accent leaves -->
    <ellipse cx="215" cy="220" rx="22" ry="36" fill="#81C784" transform="rotate(-20 215 220)"/>
    <ellipse cx="285" cy="205" rx="20" ry="32" fill="#81C784" transform="rotate(15 285 205)"/>
    
    <!-- Growth arrow -->
    <path d="M430 80 L460 30 L490 80 M460 30 L460 150" stroke="#C8E6C9" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
  
  <!-- App name -->
  <text x="642" y="1750" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ShuriGrow</text>
  <text x="642" y="1820" font-family="Arial, sans-serif" font-size="32" fill="#C8E6C9" text-anchor="middle">Cultive com precisão</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="600" r="8" fill="#C8E6C9" opacity="0.5"/>
  <circle cx="1084" cy="800" r="10" fill="#C8E6C9" opacity="0.4"/>
  <circle cx="300" cy="2200" r="6" fill="#C8E6C9" opacity="0.3"/>
  <circle cx="984" cy="2000" r="8" fill="#C8E6C9" opacity="0.4"/>
</svg>
