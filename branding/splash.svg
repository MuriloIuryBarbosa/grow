<svg width="1284" height="2778" viewBox="0 0 1284 2778" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#388E3C"/>
      <stop offset="50%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A5D6A7"/>
      <stop offset="100%" style="stop-color:#66BB6A"/>
    </linearGradient>
    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D4C41"/>
      <stop offset="100%" style="stop-color:#8D6E63"/>
    </linearGradient>
    <linearGradient id="potGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A1887F"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="1284" height="2778" fill="url(#bgGradient)"/>
  
  <!-- Centered plant icon -->
  <g transform="translate(392, 989)">
    <!-- Plant pot -->
    <path d="M150 430 L350 430 L310 550 L190 550 Z" fill="url(#potGradient)" filter="url(#shadow)"/>
    <ellipse cx="250" cy="430" rx="100" ry="18" fill="#8D6E63"/>
    <ellipse cx="250" cy="430" rx="88" ry="14" fill="#5D4037"/>
    
    <!-- Main stem from soil -->
    <path d="M250 430 C250 370 250 280 250 150" stroke="url(#stemGradient)" stroke-width="14" fill="none" stroke-linecap="round"/>
    
    <!-- Left branch -->
    <path d="M250 300 Q200 275 160 220" stroke="url(#stemGradient)" stroke-width="9" fill="none" stroke-linecap="round"/>
    
    <!-- Right branch -->
    <path d="M250 250 Q300 225 340 175" stroke="url(#stemGradient)" stroke-width="9" fill="none" stroke-linecap="round"/>
    
    <!-- Small branches -->
    <path d="M250 360 Q225 340 200 310" stroke="url(#stemGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M250 350 Q275 330 300 300" stroke="url(#stemGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Main top leaf -->
    <ellipse cx="250" cy="100" rx="45" ry="75" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-5 250 100)"/>
    <path d="M250 145 Q250 100 250 40" stroke="#43A047" stroke-width="2.5" fill="none"/>
    
    <!-- Left leaf -->
    <ellipse cx="140" cy="190" rx="38" ry="62" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(-40 140 190)"/>
    <path d="M160 220 Q140 190 120 130" stroke="#43A047" stroke-width="2" fill="none"/>
    
    <!-- Right leaf -->
    <ellipse cx="360" cy="150" rx="35" ry="58" fill="url(#leafGradient)" filter="url(#shadow)" transform="rotate(35 360 150)"/>
    <path d="M340 175 Q360 150 375 100" stroke="#43A047" stroke-width="2" fill="none"/>
    
    <!-- Small accent leaves -->
    <ellipse cx="195" cy="280" rx="18" ry="32" fill="#81C784" transform="rotate(-25 195 280)"/>
    <ellipse cx="305" cy="270" rx="17" ry="30" fill="#81C784" transform="rotate(20 305 270)"/>
    
    <!-- Growth arrow -->
    <g transform="translate(400, 30)">
      <path d="M0 70 L28 20 L56 70" stroke="#C8E6C9" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 20 L28 130" stroke="#C8E6C9" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- App name -->
  <text x="642" y="1700" font-family="Arial Black, Arial, sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ShuriGrow</text>
  <text x="642" y="1780" font-family="Arial, sans-serif" font-size="36" fill="#C8E6C9" text-anchor="middle" letter-spacing="2">Cultive com precisão</text>
  
  <!-- Decorative sparkles -->
  <circle cx="200" cy="500" r="8" fill="#C8E6C9" opacity="0.5"/>
  <circle cx="1084" cy="700" r="10" fill="#C8E6C9" opacity="0.4"/>
  <circle cx="280" cy="2300" r="6" fill="#C8E6C9" opacity="0.3"/>
  <circle cx="1004" cy="2100" r="8" fill="#C8E6C9" opacity="0.4"/>
  <circle cx="150" cy="1200" r="5" fill="#C8E6C9" opacity="0.35"/>
  <circle cx="1134" cy="1400" r="7" fill="#C8E6C9" opacity="0.3"/>
</svg>
